# =============================================================================
# Nom         : shellcheck.yml
# Description : Workflow GitHub Actions — analyse statique des scripts Bash
# Déclencheurs: push et pull_request vers la branche main
# Auteur      : Fire-UX Contributors
# Version     : 1.0.0
# =============================================================================

name: ShellCheck

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  shellcheck:
    name: Analyse statique (shellcheck)
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Installation de shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck

      - name: Analyse de fire-ux.sh
        run: shellcheck --format=gcc fire-ux.sh

      - name: Analyse de install.sh
        run: shellcheck --format=gcc install.sh

      - name: Analyse de uninstall.sh
        run: shellcheck --format=gcc uninstall.sh
